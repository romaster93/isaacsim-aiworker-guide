# Explore Lite Parameters for IsaacSim (FFW-SG2)
# m-explore-ros2 frontier-based autonomous exploration
# SLAM + Nav2 navigation_launch.py와 함께 사용

explore_node:
  ros__parameters:
    use_sim_time: true
    robot_base_frame: base_link
    costmap_topic: map
    costmap_updates_topic: map_updates
    visualize: true
    planner_frequency: 0.15
    progress_timeout: 30.0
    potential_scale: 10.0
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.3
    min_frontier_size: 1.5
    return_to_init: true
